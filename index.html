<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Paraiso_de_Paz.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B3A6B" />
    <meta name="description" content="Registro de contacto — Cochería Paraíso de Paz" />
    <title>Paraíso de Paz — Registro de contacto</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Version gate: runs synchronously BEFORE the ES module bundle loads.
         This ensures createClient() in supabase.ts reads a clean localStorage. -->
    <script>
      (function () {
        var V = '1.0.2';
        var KEY = 'aura_app_version';
        if (localStorage.getItem(KEY) !== V) {
          Object.keys(localStorage)
            .filter(function (k) {
              return k.startsWith('sb-') || k === 'aura_session_user' || k === 'aura_panel_auth';
            })
            .forEach(function (k) { localStorage.removeItem(k); });
          localStorage.setItem(KEY, V);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
